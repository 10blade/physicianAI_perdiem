name: Daily search

on:
  schedule:
    - cron: "23 11 * * *" # every day at 11:23 UTC (5:23 AM in Chicago in winter, 6:23 AM in summer)
  workflow_dispatch:
    inputs:
      probe:
        description: "Optional: instead of searching, find the job board of these companies (comma-separated names)"
        required: false
        default: ""

permissions:
  contents: write # save results/ and data/ back to the repository
  issues: write # open an issue when new matches appear

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Find job boards
        if: ${{ inputs.probe }}
        env:
          PROBE: ${{ inputs.probe }}
        run: python -m perdiem_finder probe --summary "$GITHUB_STEP_SUMMARY" "$PROBE"

      - name: Search
        id: search
        if: ${{ !inputs.probe }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python -m perdiem_finder search
          cat results/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save results
        if: ${{ steps.search.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results data docs
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Daily results $(date -u +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Open an issue for new matches
        if: ${{ steps.search.outcome == 'success' && steps.search.outputs.new_qualified != '' && steps.search.outputs.new_qualified != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.search.outputs.issue_title }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file results/new.md
