# Careers pages with no public job API, read on a best-effort basis (robots.txt is respected).
# A page that builds its list with JavaScript shows "no job links found"; check it by hand.
# Not listed because they cannot be read automatically (Nov 2026): Mercor and Handshake AI
# (JavaScript-only pages) and micro1 (its robots.txt asks crawlers to stay out).
pages:
  - name: Turing (careers page)
    url: https://turing.betterteam.com/
    category: AI expert platform
  - name: OpenTrain AI (medical jobs)
    url: https://www.opentrain.ai/jobs/category/medical-health/
    category: AI expert platform
  - name: 24-MAG (careers page)
    url: https://www.careers-page.com/24-mag
    category: Recruiter

