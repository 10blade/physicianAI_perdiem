# Settings and sources for the daily search.
# Edit this file on GitHub (pencil icon) - the next run picks up your changes.

settings:
  min_hourly_usd: 100        # the pay bar
  pay_rule: top              # top   = the TOP of the posted range must reach the bar ("$80-$150/hr" counts)
                             # floor = the BOTTOM must reach it (stricter: "$80-$150/hr" does not count)
  include_pay_unlisted: true # also list flexible physician roles whose posting gives no rate
  include_salaried: false    # also list salaried (annual pay) physician roles at AI companies

# Optional: Google Jobs (collects LinkedIn, Indeed, ZipRecruiter, ...) through SerpApi.
# Runs only when the repository has a SERPAPI_KEY secret. Each query uses one search per day.
google_jobs:
  location: United States
  pages_per_query: 1
  queries:
    - physician AI trainer contract
    - physician AI evaluation hourly remote
    - medical doctor AI expert part time

# Companies whose public job board is searched every day.
#   board: "<type>:<slug>"  - pins the board. Types: greenhouse, ashby, lever, lever_eu,
#                             workable, smartrecruiters, recruitee
